name: Web CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to server (nginx)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production env)
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # nginx serves pnpsports.in straight from /opt/pnp-web/dist. The new
      # build is unpacked next to it and swapped in with two renames, so a
      # failed upload never leaves the live site half-written. The previous
      # build is kept as dist.prev for a quick manual rollback.
      - name: Ship build and swap
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts"
          tar czf - -C dist . | $SSH "$DEPLOY_USER@$DEPLOY_HOST" '
            set -euo pipefail
            cd /opt/pnp-web
            rm -rf dist.new && mkdir dist.new
            tar xzf - -C dist.new
            rm -rf dist.prev
            mv dist dist.prev
            mv dist.new dist
          '

      - name: Verify live site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          EXPECTED="$(grep -o 'assets/index-[^"]*\.js' dist/index.html)"
          curl -fsS --resolve "pnpsports.in:443:$DEPLOY_HOST" https://pnpsports.in/ | grep -q "$EXPECTED"
          echo "Live site OK ($EXPECTED)"
