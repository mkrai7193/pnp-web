name: Web CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  build:
    name: Lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to server (nginx)
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (production env)
        run: npm run build

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Ship release and deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -euo pipefail
          SSH="ssh -i ~/.ssh/deploy_key -o UserKnownHostsFile=~/.ssh/known_hosts"
          RELEASE_ID="$(date -u +%Y%m%d%H%M%S)-${GITHUB_SHA::8}"

          echo "Creating release dir $RELEASE_ID"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p /opt/pnp-web/releases/$RELEASE_ID"

          echo "Shipping build"
          tar czf - -C dist . | $SSH "$DEPLOY_USER@$DEPLOY_HOST" "tar xzf - -C /opt/pnp-web/releases/$RELEASE_ID"

          echo "Running remote deploy script"
          $SSH "$DEPLOY_USER@$DEPLOY_HOST" "bash -s $RELEASE_ID" < deploy/deploy-remote.sh

      - name: Verify live site
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          EXPECTED="$(grep -o 'assets/index-[^"]*\.js' dist/index.html)"
          curl -fsS --resolve "pnpsports.in:443:$DEPLOY_HOST" https://pnpsports.in/ | grep -q "$EXPECTED"
          echo "Live site OK ($EXPECTED)"
